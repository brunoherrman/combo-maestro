name: Publish to npm

# Trusted publishing (OIDC): no NPM_TOKEN, no OTP. npm verifies the workflow
# identity through GitHub's OIDC token. Publishes when a v* tag is pushed.
# One-time setup on npmjs.com -> package Settings -> Trusted Publisher:
#   provider: GitHub Actions
#   repository: brunoherrman/combo-maestro
#   workflow: publish.yml

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs a recent npm that speaks OIDC.
      - run: npm install -g npm@latest

      - run: npm test

      - run: npm publish --access public
